apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netflix-clone-ingress
  namespace: netclone
spec:
  ingressClassName: nginx
  rules:
    - host: netflix.local
      http:
        paths:
          - path: /api/downloads
            pathType: Prefix
            backend:
              service:
                name: netflix-clone-downloader-service
                port:
                  number: 3001
          - path: /api/stream
            pathType: Prefix
            backend:
              service:
                name: netflix-clone-streamer-service
                port:
                  number: 3002
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: netflix-clone-backend-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netflix-clone-frontend-service
                port:
                  number: 80
