apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-clone-downloader
  namespace: netclone
spec:
  # A single writer: download progress lives in memory, and Recreate makes
  # sure two versions never write to the volume at the same time.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netflix-clone-downloader
  template:
    metadata:
      labels:
        app: netflix-clone-downloader
    spec:
      containers:
        - name: netflix-clone-downloader
          image: ghcr.io/simongautier/netclone-downloader:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: MEDIA_DIR
              value: /media
          volumeMounts:
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: netflix-clone-media
