apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-clone-backend
  namespace: netclone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-clone-backend
  template:
    metadata:
      labels:
        app: netflix-clone-backend
    spec:
      containers:
        - name: netflix-clone-backend
          image: ghcr.io/simongautier/netclone-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: netflix-clone-backend-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
