apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-clone-frontend
  namespace: netclone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-clone-frontend
  template:
    metadata:
      labels:
        app: netflix-clone-frontend
    spec:
      containers:
        - name: netflix-clone-frontend
          image: ghcr.io/simongautier/netclone-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
