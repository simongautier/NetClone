name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/netclone-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/netclone-frontend
  DOWNLOADER_IMAGE: ghcr.io/${{ github.repository_owner }}/netclone-downloader
  STREAMER_IMAGE: ghcr.io/${{ github.repository_owner }}/netclone-streamer

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run build

  downloader-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: downloader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: downloader/package-lock.json

      - run: npm ci
      - run: npm run build

  streamer-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streamer/package-lock.json

      - run: npm ci
      - run: npm run build

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-publish:
    needs: [backend-build, downloader-build, streamer-build, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: backend
            dockerfile: backend/dockerfile
            image: BACKEND_IMAGE
          - context: frontend
            dockerfile: frontend/dockerfile
            image: FRONTEND_IMAGE
          - context: downloader
            dockerfile: downloader/dockerfile
            image: DOWNLOADER_IMAGE
          - context: streamer
            dockerfile: streamer/dockerfile
            image: STREAMER_IMAGE
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env[matrix.image] }}:latest
            ${{ env[matrix.image] }}:${{ github.sha }}
